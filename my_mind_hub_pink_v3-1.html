<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Mind Hub</title><style>:root{font-family:system-ui,Arial;background:#fff1f7;color:#421626}*{box-sizing:border-box}body{margin:0}header{background:#ffb8d2;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:1.5rem;margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #f96b9f;background:#fff;border-radius:12px;padding:9px 12px;color:#421626}button:focus-visible,input:focus-visible{outline:3px solid #ff3f91}.tabs{display:flex;overflow-x:auto;gap:6px;padding:12px;background:#fff9fc}.tabs button{white-space:nowrap;border:2px solid transparent;color:#421626;font-weight:600}.tabs button.active{border-color:#9f1d4f;box-shadow:0 2px 5px #aaa}main{max-width:1050px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #edc4d8;border-radius:18px;padding:16px;margin-bottom:16px}h2{margin-top:0;color:#b5255c}label{display:block;margin:10px 0 5px;font-weight:600}input,textarea,select{width:100%;padding:11px;border:1px solid #e77da6;border-radius:10px;background:#fff}textarea{min-height:85px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.primary{background:#e82d78;color:white}.entry{border:1px solid #efcfdf;border-radius:12px;padding:12px;margin:10px 0;background:#fffafd;overflow-wrap:anywhere}.muted{color:#744055;font-size:.9rem}.photo{max-width:170px;max-height:150px;display:block;margin:8px 0;border-radius:8px}.checkrow{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}.checkrow label{display:flex;align-items:center;gap:5px;margin:0;font-weight:400}.checkrow input{width:auto}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.small{font-size:.85rem}#status{font-size:.85rem}footer{text-align:center;padding:20px;color:#744055}@media print{header,.tabs,.actions,.editor{display:none!important}main{max-width:none}.panel{break-inside:avoid}}</style></head><body><header><div><h1>💗 My Mind Hub</h1><div class="small">A place for everything on your mind</div></div><button onclick="showTab('My Today')">⌂ Home</button></header><nav class="tabs" id="tabs"></nav><main><section class="panel" id="welcome"><h2 id="heading">My Today</h2><p id="description"></p><div id="today" class="grid"></div></section><section class="panel editor"><h2>Add something</h2><form id="form"><label for="category">Save in tab</label><select id="category"></select><label for="title">Title / name</label><input id="title" required placeholder="What would you like to remember?"><label for="note">Notes</label><textarea id="note" placeholder="Type details here..."></textarea><div class="grid"><div><label for="date">Date</label><input id="date" type="date"></div><div><label for="price">Price / amount (optional)</label><input id="price" type="number" min="0" step=".01" placeholder="0.00"></div><div><label for="person">Person / recipient (optional)</label><input id="person" placeholder="Name"></div></div><label for="photo">Attach picture or receipt (choose from your files or photo library)</label><input id="photo" type="file" accept="image/*"><div id="giftFields" class="checkrow hidden"><label><input id="purchased" type="checkbox"> Purchased</label><label><input id="wrapped" type="checkbox"> Wrapped</label><label><input id="delivered" type="checkbox"> Delivered</label></div><div class="actions"><button type="button" id="mic">🎤 Dictate notes</button><button type="submit" class="primary">💗 Save entry</button><button type="button" onclick="resetForm()">Clear</button></div><p class="muted" id="status" role="status">Saved entries appear in the selected tab. Use Backup regularly; browser storage can be unavailable when opening downloaded files.</p></form></section><section class="panel"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><h2 style="margin:0">Saved entries</h2><div class="actions"><button onclick="undoDelete()">↶ Undo delete</button><button onclick="print()">🖨 Print</button><button onclick="exportData()">⬇ Backup</button><button onclick="document.getElementById('import').click()">⬆ Restore</button><input class="hidden" id="import" type="file" accept="application/json" onchange="importData(event)"></div></div><div id="entries"></div></section></main><footer>My Mind Hub • Personal-use prototype • Keep backups of important information</footer><script>
const tabs=['My Today','Brain Dump','Appointments','Calendar','Family & Friends','Christmas List','Other Gifts','Finances','Legal','Medical','Recipes','Animal Tips','Contacts','Ideas','Lists'];const colors=['#FF85B3','#FFB8D2','#FF69B4','#FFD6E5','#FF759F','#FF5C8A','#FFC2D8','#FF91B7','#FF3F91','#FFABC8','#FFD0E0','#FF80AA','#FFBDD3','#FF9BC2','#FF80B7'];let tab='My Today',editId=null;let lastDeleted=null;const key='my_mind_hub_entries_v1';let data=[];try{data=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(data))data=[]}catch(e){data=[]}const $=id=>document.getElementById(id);const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem(key,JSON.stringify(data));$('status').textContent='Saved on this device ✓';return true}catch(e){$('status').textContent='⚠ Could not save. Storage may be full, especially if photos are large. Export a backup.';alert('Could not save. Try a smaller photo or export a backup.');return false}}function showTab(t){tab=t;document.querySelectorAll('.tabs button').forEach(b=>{b.classList.toggle('active',b.textContent===t)});$('heading').textContent=t;$('description').textContent=t==='Calendar'?'Upcoming dated entries from all sections, together in one place.':t==='My Today'?'Your upcoming items and Brain Dump notes in one view. Use Save in tab to file new entries.':'Keep notes, photos, dates and details together.';$('giftFields').classList.toggle('hidden',!['Christmas List','Other Gifts'].includes(t));resetForm();$('category').value=(t==='My Today'||t==='Calendar')?'Appointments':t;render();window.scrollTo({top:0,behavior:'smooth'})}function resetForm(){$('form').reset();$('category').value=(tab==='My Today'||tab==='Calendar')?'Appointments':tab;editId=null;$('status').textContent='Saved entries appear in the selected tab. Use Backup regularly; browser storage can be unavailable when opening downloaded files.'}function entriesForTab(){if(tab==='My Today')return data.filter(x=>x.date>=new Date().toISOString().slice(0,10)||x.tab==='Brain Dump').sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));if(tab==='Calendar')return data.filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date));return data.filter(x=>x.tab===tab)}function render(){let arr=entriesForTab();$('entries').innerHTML=arr.length?arr.map(x=>`<article class="entry"><strong>${escapeHtml(x.title)}</strong> <span class="muted">${escapeHtml(x.tab)}</span>${x.date?`<p class="muted">📅 ${escapeHtml(x.date)}</p>`:''}${x.person?`<p>👤 ${escapeHtml(x.person)}</p>`:''}${x.price?`<p>$${Number(x.price).toFixed(2)}</p>`:''}${x.note?`<p style="white-space:pre-wrap">${escapeHtml(x.note)}</p>`:''}${x.photo?`<img class="photo" alt="Attached photo" src="${x.photo}">`:''}${['Christmas List','Other Gifts'].includes(x.tab)?`<div class="checkrow">${['purchased','wrapped','delivered'].map(k=>`<label><input type="checkbox" ${x[k]?'checked':''} onchange="setCheck('${x.id}','${k}',this.checked)"> ${k[0].toUpperCase()+k.slice(1)}</label>`).join('')}</div>`:''}<div class="actions"><button onclick="editEntry('${x.id}')">Edit</button><button onclick="deleteEntry('${x.id}')">Delete</button></div></article>`).join(''):'<p class="muted">No entries yet. Add your first one above.</p>';if(tab==='My Today')$('today').innerHTML=`<div class="entry"><strong>Upcoming dated items</strong><p>${data.filter(x=>x.date>=new Date().toISOString().slice(0,10)).length} saved</p></div><div class="entry"><strong>Brain Dump notes</strong><p>${data.filter(x=>x.tab==='Brain Dump').length} saved</p></div>`;else if(tab==='Christmas List'||tab==='Other Gifts'){let gifts=data.filter(x=>x.tab===tab);$('today').innerHTML=['purchased','wrapped','delivered'].map(k=>`<div class="entry"><strong>${k[0].toUpperCase()+k.slice(1)}</strong><p>${gifts.filter(x=>x[k]).length} / ${gifts.length}</p></div>`).join('')}else $('today').innerHTML=''}function setCheck(id,k,v){let x=data.find(y=>y.id===id);if(x){x[k]=v;persist();render()}}function editEntry(id){let x=data.find(y=>y.id===id);if(!x)return;showTab(x.tab);editId=id;$('category').value=x.tab;for(let k of ['title','note','date','price','person'])$(k).value=x[k]||'';for(let k of ['purchased','wrapped','delivered'])$(k).checked=!!x[k];$('status').textContent='Editing entry — press Save entry when done.';$('title').focus()}function deleteEntry(id){if(!confirm('Move this entry to Recently Deleted?'))return;let x=data.find(y=>y.id===id);if(!x)return;lastDeleted=x;data=data.filter(y=>y.id!==id);if(persist()){render();$('status').textContent='Moved to Recently Deleted. Use Undo to restore.'}else{data.unshift(x);lastDeleted=null;render()}}
function undoDelete(){if(!lastDeleted){alert('Nothing to undo yet.');return}data.unshift(lastDeleted);if(persist()){lastDeleted=null;render()}}
$('form').onsubmit=async e=>{e.preventDefault();let old=data.find(x=>x.id===editId);let x={...(old||{}),id:editId||String(Date.now())+Math.random().toString(36).slice(2),tab:$('category').value,title:$('title').value.trim(),note:$('note').value,date:$('date').value,price:$('price').value,person:$('person').value};for(let k of ['purchased','wrapped','delivered'])x[k]=$(k).checked;let file=$('photo').files[0];if(file){if(file.size>1500000){alert('Please choose a photo smaller than 1.5 MB for browser storage.');return}x.photo=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}let previous=data.slice();if(old)data=data.map(y=>y.id===editId?x:y);else data.unshift(x);if(persist()){const savedTab=x.tab;showTab(savedTab);$('status').textContent='✓ Saved successfully in '+savedTab+'. Your entry appears under Saved entries below.';document.getElementById('entries').scrollIntoView({behavior:'smooth',block:'start'});}else{data=previous;render()}};function exportData(){let blob=new Blob([JSON.stringify({app:'My Mind Hub',version:1,entries:data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-mind-hub-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){let f=e.target.files[0];if(!f)return;try{let o=JSON.parse(await f.text());if(!Array.isArray(o.entries))throw Error('Invalid backup');if(!confirm('Restore this backup? This replaces current entries.'))return;let prev=data;data=o.entries;if(!persist())data=prev;render()}catch(err){alert('This does not look like a My Mind Hub backup.')}e.target.value=''}$('mic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice dictation is not available in this browser. Try Chrome or your phone keyboard microphone.');return}let r=new SR();r.lang='en-US';r.onresult=e=>{$('note').value+=($('note').value?' ':'')+e.results[0][0].transcript};r.onerror=e=>alert('Microphone error: '+e.error+'. Check browser permissions and use HTTPS if needed.');r.start()};$('category').innerHTML=tabs.filter(t=>!['My Today','Calendar'].includes(t)).map(t=>`<option value="${t}">${t}</option>`).join('');$('tabs').innerHTML=tabs.map((t,i)=>`<button style="background:${colors[i]}" onclick="showTab('${t.replaceAll("'","\\'")}')">${t}</button>`).join('');showTab('My Today');</script></body></html>
